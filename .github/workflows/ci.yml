name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: Pull images
        run: |
          for image in zfnd/zebra:6.2.3 zfnd/zebra:7.0.0-rc.0 zakuracore/zakura:1.6.0 electriccoinco/lightwalletd:v0.5.4 \
            zingodevops/zaino:0.10.1-no-tls fullstorydev/grpcurl:v1.9.3; do
            docker pull "$image"
          done
      - name: Rehearsals
        run: cargo test --test rehearse -- --ignored
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-reports
          path: out/

  action:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["zfnd/zebra:6.2.3", "zfnd/zebra:7.0.0-rc.0"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Rehearse with the action
        id: zrehearse
        uses: ./
        with:
          plan: examples/nu6_3.toml
          image: ${{ matrix.image }}
      - name: Report says passed
        env:
          REPORT: ${{ steps.zrehearse.outputs.report }}
        run: |
          grep -q '"passed": true' "$REPORT"
