name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: Pull Zebra
        run: docker pull zfnd/zebra:6.2.3 && docker pull zfnd/zebra:7.0.0-rc.0
      - name: Rehearsals
        run: cargo test --test rehearse -- --ignored
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-reports
          path: out/

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Rehearse with the action
        id: zrehearse
        uses: ./
        with:
          plan: examples/nu7.toml
      - name: Report says passed
        env:
          REPORT: ${{ steps.zrehearse.outputs.report }}
        run: |
          grep -q '"passed": true' "$REPORT"
