[package]
name = "zrehearse"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
bs58 = { version = "0.5.1", features = ["check"] }
getrandom = { version = "0.2.17", features = ["std"] }
ripemd = "0.1.3"
secp256k1 = "0.29.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["json"] }

[dev-dependencies]
blake2b_simd = "1.0.5"
