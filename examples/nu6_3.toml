# Rehearse NU6.3 (Ironwood) on Zebra 6.2.3, activating at the default height 110.
name = "nu6.3 on zebra 6.2.3"

[node]
image = "zfnd/zebra:6.2.3"

[upgrade]
name = "NU6.3"
previous = "NU6.2"

# A stand-in for a real project's test suite. It asks the node for its chain
# tip branch ID and fails unless the upgrade is the one in force.
[[project]]
name = "rpc-smoke"
run = '''
curl -sf -X POST -H 'Content-Type: application/json' \
  -d '{"jsonrpc":"2.0","id":1,"method":"getblockchaininfo","params":[]}' \
  "$ZREHEARSE_RPC_URL" | grep -q "\"chaintip\":\"$ZREHEARSE_BRANCH_ID\""
'''
timeout_secs = 60

# A project that signs and sends transactions with the funded key. The node
# must accept only the spend signed for the new branch ID.
[[project]]
name = "spend"
run = "cargo run --quiet --example spend"
