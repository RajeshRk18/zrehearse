# Rehearse NU6.3 with a real wallet. zcash-devtool restores the public test
# seed phrase, syncs through lightwalletd, and spends Orchard and Ironwood
# notes in one transaction. It needs zcash-devtool on PATH.
name = "shielded wallet across nu6.3"

[node]
image = "zfnd/zebra:6.2.3"

[upgrade]
name = "NU6.3"
previous = "NU6.2"

[light_server]
kind = "lightwalletd"
image = "electriccoinco/lightwalletd:v0.5.4"

[[project]]
name = "shielded-wallet"
run = "sh shielded-wallet.sh"
