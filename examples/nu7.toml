# Rehearse NU7 on Zebra 7.0.0-rc.0, activating at the default height 110.
name = "nu7 on zebra 7.0.0-rc.0"

[node]
image = "zfnd/zebra:7.0.0-rc.0"

[upgrade]
name = "NU7"
previous = "NU6.3"

# A stand-in for a real project's test suite. It asks the node for its chain
# tip branch ID and fails unless the upgrade is the one in force.
[[project]]
name = "rpc-smoke"
run = '''
curl -sf -X POST -H 'Content-Type: application/json' \
  -d '{"jsonrpc":"2.0","id":1,"method":"getblockchaininfo","params":[]}' \
  "$ZREHEARSE_RPC_URL" | grep -q "\"chaintip\":\"$ZREHEARSE_BRANCH_ID\""
'''
timeout_secs = 60
