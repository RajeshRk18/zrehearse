# Rehearse NU6.3 with a real sync engine. zcash-devtool restores the public
# test seed phrase, syncs through lightwalletd, and must see Orchard notes
# from before activation and Ironwood notes from after. It needs zcash-devtool
# on PATH.
name = "shielded sync across nu6.3"

[node]
image = "zfnd/zebra:6.2.3"

[upgrade]
name = "NU6.3"
previous = "NU6.2"

[light_server]
kind = "lightwalletd"
image = "electriccoinco/lightwalletd:v0.5.4"

[[project]]
name = "shielded-sync"
run = "sh shielded-wallet.sh sync"
